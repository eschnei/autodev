name: engine-ci
on:
  push: { branches: ["**"] }
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax (bash -n)
        run: |
          set -e
          find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 -n1 bash -n
          echo "all shell scripts parse"

      - name: shellcheck (warnings allowed, errors fail)
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          find . -name "*.sh" -not -path "./.git/*" -print0 | xargs -0 shellcheck -S error

      - name: Node syntax (node --check)
        run: |
          set -e
          find . -name "*.mjs" -not -path "./.git/*" -print0 | xargs -0 -n1 node --check
          echo "all mjs parse"

      - name: JSON validity (plugin manifest, reference config, hook wiring)
        run: |
          set -e
          jq -e . .claude-plugin/plugin.json >/dev/null
          jq -e . reference/deployment.example.json >/dev/null
          jq -e . hooks/hooks.json >/dev/null
          echo "JSON valid"

      - name: Regression suite (smoke + tests/suite/*.sh, hermetic)
        run: bash tests/run.sh
